<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Their essentials, thoughtfully spaced</title><desc id="desc">Give food, fresh water and the litter tray their own accessible places. Conceptual editorial illustration, not an installation plan.</desc><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#F3EEE3"/><stop offset="1" stop-color="#E9E4D6"/></linearGradient><pattern id="rope" width="50" height="9" patternUnits="userSpaceOnUse"><rect width="50" height="9" fill="#C7AC83"/><path d="M0 8 L50 2" stroke="#A88B65" stroke-width="2"/></pattern><pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#B4BDA5"/><path d="M0 3 H12 M3 0 V12" stroke="#D5DBC7" stroke-width="2"/></pattern></defs><rect width="1200" height="760" fill="#FAF7EF"/><g font-family="Arial,sans-serif"><text x="56" y="53" font-size="18" fill="#314C40" letter-spacing="4">MEW &amp; MAPLE</text><text x="1144" y="53" font-size="14" fill="#314C40" text-anchor="end" letter-spacing="2">THE INDOOR CAT JOURNAL</text><path d="M56 76 H1144" stroke="#CFCDBD"/><text x="56" y="140" font-size="48" fill="#314C40" font-family="Georgia,serif">Their essentials, thoughtfully spaced</text><text x="58" y="181" font-size="22" fill="#314C40" >Give food, fresh water and the litter tray their own accessible places.</text><rect x="56" y="213" width="1088" height="374" rx="18" fill="url(#wall)"/><path d="M57 489 H1143 V568 Q1143 587 1125 587 H75 Q57 587 57 568Z" fill="#DED1B9"/><path d="M57 489 H1143 M57 498 H1143" stroke="#CBBCA3" stroke-width="2"/><path d="M413 251 V551 M783 251 V551" stroke="#A3A791" stroke-width="2" stroke-dasharray="5 9"/><ellipse cx="241" cy="514" rx="139" ry="32" fill="#D0B392"/><ellipse cx="599" cy="514" rx="132" ry="32" fill="#B9C5AF"/><g transform="translate(243 480)"><ellipse cy="21" rx="74" ry="14" fill="#354F40" opacity=".09"/><path d="M-65 -