name: Validate source and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check:source
      - run: npm run build
      - name: Validate Cloudflare Workers dist and preview headers
        run: npm run audit:workers
      - name: Validate Workers deployment bundle without publishing
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Check built HTML links, anchors and search leakage
        run: node scripts/check-static-navigation.mjs
      - name: Check preview output does not expose draft content or indexing metadata
        run: npm run audit:preview
      - name: Render editorial SVG illustrations for visual QA
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          mkdir -p editorial-svg-previews
          for image in public/images/*.svg; do
            [ -f "$image" ] || continue
            output="editorial-svg-previews/$(basename "$image" .svg).png"
            rsvg-convert --width 960 --height 608 "$image" --output "$output"
            test -s "$output"
          done
      - name: Save editorial SVG visual QA previews
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mew-maple-editorial-svg-previews
          path: editorial-svg-previews/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Install temporary Chromium browser QA dependencies
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.11.0 lighthouse@12.8.2
          npx playwright install --with-deps chromium
      - name: Test local draft articles and safe preview in desktop and mobile Chromium
        if: github.event_name == 'pull_request'
        run: node scripts/browser-qa.mjs
      - name: Measure local draft-safe homepage with mobile Lighthouse
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4325 > /tmp/mew-maple-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:4325/ > /dev/null; then break; fi
            if [ "$attempt" -eq 50 ]; then cat /tmp/mew-maple-preview.log; exit 1; fi
            sleep 0.3
          done
          export CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npx --no-install lighthouse http://127.0.0.1:4325/ \
            --only-categories=performance,accessibility,best-practices \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet --output=json --output-path=/tmp/mew-maple-lighthouse-mobile.json
          node scripts/report-local-lighthouse.mjs /tmp/mew-maple-lighthouse-mobile.json
      - name: Save browser QA screenshots only while repository is private
        if: always() && github.event_name == 'pull_request' && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: mew-maple-browser-qa
          path: browser-qa-screenshots/*.png
          if-no-files-found: warn
          retention-days: 1
      - name: Verify no draft guide HTML is exported
        run: |
          if [ -d dist/guides ] && find dist/guides -type f -name '*.html' | grep -q .; then
            echo "Unsafe draft guide pages were included in static output"
            exit 1
          fi
      - name: Verify preview search index contains no drafts
        run: |
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('dist/search-index.json','utf8'));if(!Array.isArray(data)||data.length!==0)process.exit(1);"
      - name: Save private preview-safe site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: mew-maple-private-preview-safe
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Validate approved staged production build
        env:
          SITE_URL: https://mewandmaple.com
          PUBLIC_SITE_READY: 'true'
          PUBLISH_APPROVED: 'YES'
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm run build
          npm run audit:workers
          node scripts/check-static-navigation.mjs
          test -f dist/guides/indoor-cat-enrichment-ideas/index.html
          if find dist/guides -mindepth 2 -maxdepth 2 -name 'index.html' | grep -v 'indoor-cat-enrichment-ideas' | grep -q .; then
            echo "Unapproved review guide was exported in staged production build"
            exit 1
          fi
