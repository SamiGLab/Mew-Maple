name: Validate source and build
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Switch to npm ci and enable npm cache when package-lock.json is committed.
      - run: npm install --no-audit --no-fund
      - run: npm run check:source
      - run: npm run build
